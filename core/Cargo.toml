[package]
name = "pubky-maps-core"
version = "0.1.0"
description = "Pubky Maps core: Pubky sign-in, storage and social objects for the app, exposed through UniFFI"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pubky_maps_core"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
map-links = { path = "map-links" }
pubky = { version = "0.18.0", features = ["json"] }
pubky-social-specs = "=1.0.0-rc.2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["net", "io-util"] }
pubky-testnet = "0.18.0"
