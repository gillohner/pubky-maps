name: gradle-advisories
# Advisories of the Maven libraries the app ships (scripts/ci/gradle-advisories.py): Gradle lists the
# libraries of the release APK and bundle of both flavours (:androidApp:listShippedLibraries), OSV
# (keyless) answers their advisories; one that gradle/advisory-ignores.toml does not ignore with a
# reason fails, and so does an ignore that matches nothing any more. Runs when a dependency or the
# check changes, and every Monday on main, as new advisories come without a change here.
on:
  push:
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/advisory-ignores.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "**/*.gradle.kts"
      - "scripts/ci/gradle-advisories.py"
      - ".github/workflows/gradle-advisories.yml"
  pull_request:
    paths:
      - "gradle/libs.versions.toml"
      - "gradle/advisory-ignores.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - "**/*.gradle.kts"
      - "scripts/ci/gradle-advisories.py"
      - ".github/workflows/gradle-advisories.yml"
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

concurrency:
  group: gradle-advisories-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Downloads time out and retry instead of failing on one slow response (as in android.yml).
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=2000

jobs:
  advisories:
    name: Maven advisories (OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # android.yml's build job saves the Gradle cache; this job only reads it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-android-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-android-build-
            gradle-
      # Resolving the graph needs no build: no Rust, no compile, no artifact downloads beyond the POMs
      # and Gradle module files.
      - name: shipped libraries
        run: ./gradlew :androidApp:listShippedLibraries
      - name: OSV advisories
        run: python3 -I scripts/ci/gradle-advisories.py androidApp/build/shippedLibraries/libraries.txt
