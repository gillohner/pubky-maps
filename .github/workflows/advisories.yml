name: advisories
# RustSec advisories of the crates the Rust core ships in the app (`cargo deny check advisories`,
# config in deny.toml): a vulnerable or unsound crate in the core's Android graph fails, and so does an
# ignore in deny.toml that no longer matches anything. Runs when the crate graph or the config changes,
# and every Monday on main, as new advisories come without a change here.
on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/advisories.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/advisories.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: advisories-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advisories:
    name: RustSec advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # A released binary (checksum checked by the action), not a 2-minute cargo install.
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
      - name: cargo deny check advisories
        run: cargo deny --locked check --deny advisory-not-detected advisories
