name: release
# Signed releases on GitHub (scripts/release/):
# - every push to main replaces the `edge` pre-release (its tag moves to the commit);
# - a `v<x.y.z>` tag makes that release (the tag must match pubkymaps.version in gradle.properties);
# - a manual run builds any branch and replaces the `dev` pre-release, which is how changes to the
#   release are tried before they merge. It never touches `edge` or a version.
#
# After publishing, install-published downloads the APK from the release it just published, checks
# its signing certificate (release/release-cert.sha256; dev: release-cert-dev.sha256) and the
# release's SHA256SUMS, installs it on the API 35 emulator and runs the smoke test on it.
#
# Each release has the signed APK (`direct`, with the in-app updater), the signed .aab for app stores
# (`store`, no updater), SHA256SUMS, and the signed update feed the APK reads:
# update-edge.json, update.json (stable, also at releases/latest/download/update.json) or update-dev.json.
#
# The release keystore is only in the sign job and the update-feed key only in the publish job;
# the Gradle build has no secrets. Both are secrets of the GitHub environment `release`, which only
# deploys from main and v* tags; manual runs use the environment `dev`, with separate dev keys (dev
# APKs embed release/update-feed-key-dev.pub and cannot update edge or stable installs).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  # One run per target release at a time (every manual run writes `dev`); a newer one waits for the
  # running one to publish.
  group: release-${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=2000
jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      release_tag: ${{ steps.v.outputs.release_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      version_code: ${{ steps.v.outputs.version_code }}
      version_name: ${{ steps.v.outputs.version_name }}
      feed_name: ${{ steps.v.outputs.feed_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: channel and version
        shell: bash
        run: |
          python3 -I scripts/release/version.py gradle.properties "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # Gradle builds the Rust core into the APK and the bundle.
      - uses: ./.github/actions/rust-android
        with:
          cache-key: android-release
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-
      - name: Gradle wrapper
        run: |
          for i in 1 2 3; do
            ./gradlew --version && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
      - name: release APK (direct) and bundle (store), unsigned
        env:
          CHANNEL: ${{ needs.meta.outputs.channel }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          VERSION_NAME: ${{ needs.meta.outputs.version_name }}
        run: |
          ./gradlew :androidApp:assembleDirectRelease :androidApp:bundleStoreRelease \
            -Ppubkymaps.versionCode="$VERSION_CODE" -Ppubkymaps.versionName="$VERSION_NAME" \
            -Ppubkymaps.updateChannel="$CHANNEL"
          mkdir -p unsigned
          cp androidApp/build/outputs/apk/direct/release/androidApp-direct-release-unsigned.apk unsigned/app.apk
          cp androidApp/build/outputs/bundle/storeRelease/androidApp-store-release.aab unsigned/app.aab
      - name: the bundle has no updater
        run: python3 -I scripts/release/aab-check.py unsigned/app.aab unsigned/app.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: unsigned/
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.meta.outputs.channel == 'dev' && 'dev' || 'release' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned
      - name: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION_NAME: ${{ needs.meta.outputs.version_name }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: |
          mkdir -p dist
          # Edge and stable APKs must carry the release certificate the installed apps have; dev APKs
          # the dev certificate.
          cert_file=release/release-cert.sha256
          [ "$CHANNEL" != dev ] || cert_file=release/release-cert-dev.sha256
          export EXPECTED_CERT_SHA256; EXPECTED_CERT_SHA256=$(cat "$cert_file")
          bash scripts/release/sign.sh unsigned/app.apk "dist/pubky-maps-$VERSION_NAME.apk" \
            unsigned/app.aab "dist/pubky-maps-$VERSION_NAME.aab"
      - name: the APK is the build it should be
        env:
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          VERSION_NAME: ${{ needs.meta.outputs.version_name }}
        run: |
          facts=$(bash scripts/release/apk-facts.sh "dist/pubky-maps-$VERSION_NAME.apk")
          echo "$facts"
          grep -qx "package=to.pubky.maps" <<< "$facts"
          grep -qx "version_code=$VERSION_CODE" <<< "$facts"
          grep -qxF "version_name=$VERSION_NAME" <<< "$facts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [meta, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.meta.outputs.channel == 'dev' && 'dev' || 'release' }}
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TAG: ${{ needs.meta.outputs.release_tag }}
      VERSION_NAME: ${{ needs.meta.outputs.version_name }}
      FEED: ${{ needs.meta.outputs.feed_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: signed update feed
        env:
          UPDATE_FEED_SIGNING_KEY: ${{ secrets.UPDATE_FEED_SIGNING_KEY }}
        run: |
          apk="dist/pubky-maps-$VERSION_NAME.apk"
          facts=$(bash scripts/release/apk-facts.sh "$apk")
          while IFS='=' read -r k v; do declare "apk_$k=$v"; done <<< "$facts"
          key="$RUNNER_TEMP/feed-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$UPDATE_FEED_SIGNING_KEY" > "$key")
          public=release/update-feed-key.pub
          [ "$CHANNEL" != dev ] || public=release/update-feed-key-dev.pub
          python3 -I scripts/release/update-feed.py --apk "$apk" --channel "$CHANNEL" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/pubky-maps-$VERSION_NAME.apk" \
            --package "$apk_package" --version-code "$apk_version_code" --version-name "$apk_version_name" \
            --min-sdk "$apk_min_sdk" --signing-key "$key" --public-key "$public" \
            --out "dist/$FEED"
          cat "dist/$FEED"
      - name: checksums
        working-directory: dist
        shell: bash
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: notes
        run: |
          short=${GITHUB_SHA::7}
          {
            case $CHANNEL in
              edge) echo "The latest build of \`main\` ($short), replaced on every push. Not a release: expect rough edges." ;;
              dev) echo "A test build of \`$GITHUB_REF_NAME\` ($short). Not a release." ;;
              stable) echo "Pubky Maps $VERSION_NAME." ;;
            esac
            echo
            echo "| Download | For |"
            echo "| :-- | :-- |"
            echo "| \`pubky-maps-$VERSION_NAME.apk\` | Android 8 and later. Updates itself from this channel ($CHANNEL) when you allow it. |"
            echo "| \`pubky-maps-$VERSION_NAME.aab\` | app stores (no in-app updater) |"
            echo "| \`$FEED\` | the signed update feed the app reads |"
            echo
            echo "Check downloads against \`SHA256SUMS\`."
          } > "$RUNNER_TEMP/notes.md"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $CHANNEL in
            edge) title="Edge (main @ ${GITHUB_SHA::7})" ;;
            dev) title="Dev ($GITHUB_REF_NAME @ ${GITHUB_SHA::7})" ;;
            stable) title="Pubky Maps $VERSION_NAME" ;;
          esac
          bash scripts/release/publish.sh "$TAG" "$title" "$RUNNER_TEMP/notes.md" dist "$FEED"

  # The APK people download: from the release just published, not from the build artefacts.
  install-published:
    needs: [meta, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHANNEL: ${{ needs.meta.outputs.channel }}
      TAG: ${{ needs.meta.outputs.release_tag }}
      VERSION_NAME: ${{ needs.meta.outputs.version_name }}
      API_LEVEL: 35
      TARGET: google_apis
      PROFILE: pixel_6
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the published APK, its checksum and its certificate
        shell: bash
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          apk="pubky-maps-$VERSION_NAME.apk"
          mkdir -p published
          curl -fsSL --retry 5 --retry-all-errors -o "published/$apk" "$base/$apk"
          curl -fsSL --retry 5 --retry-all-errors -o published/SHA256SUMS "$base/SHA256SUMS"
          (cd published && grep -F " $apk" SHA256SUMS | sha256sum -c -)
          expected=$(cat release/release-cert.sha256)
          [ "$CHANNEL" != dev ] || expected=$(cat release/release-cert-dev.sha256)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cert=$("$bt/apksigner" verify --print-certs "published/$apk" | sed -nE 's/^.*[Ss]igner.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' | head -1)
          echo "certificate SHA-256: $cert"
          if [ "$cert" != "$expected" ]; then
            echo "::error::the published APK is signed with '$cert', not the $CHANNEL certificate $expected"
            exit 1
          fi
          mv "published/$apk" published/app.apk
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The same AVD and boot snapshot as android.yml's emulator jobs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.PROFILE }}-x86_64-${{ steps.month.outputs.month }}
      - name: create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: install and smoke-test the published APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: bash scripts/ci/emulator-smoke.sh published/app.apk /tmp/published
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-published-api${{ env.API_LEVEL }}
          path: /tmp/published/
          if-no-files-found: ignore
          retention-days: 14
