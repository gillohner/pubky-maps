name: android
# One build job checks the app (unit tests, Android lint, ktlint, Roborazzi screenshots, the release
# and CI tools' self-checks) and builds the debug APK, with the Rust core built by Gradle (bindings from a
# host build, jniLibs with cargo-ndk). The emulator job installs that APK, starts the app, waits for
# the map to draw, opens Settings and each settings page, checks that a setting survives a restart,
# goes back, fails on a crash, then runs the sign-in probe (scripts/ci/sign-in-probe.py): Settings >
# Account, the QR code's pubkyauth:// link on a fixture relay, Ring's return links, a process kill in
# the middle; the map links (scripts/ci/emulator-links.sh): a geo: link, a Google Maps link and
# shared text each open the app on their place (screenshots in the artifact); and search
# (scripts/ci/emulator-search.sh) against recorded Photon and Pinakes answers served on the runner;
# and the place page (scripts/ci/emulator-place.sh): an OSM link opens its page with the recorded
# Pinakes card and Nexus tags, posts and lists, the sheet is raised and closed with back.
# When the app, the core or CI changed, synonym-blocked runs the app with every Synonym host
# unreachable (scripts/ci/synonym-blocked.py): the map, the cached account and the degraded banner,
# a place saved in airplane mode waits and Android starts the closed app for it when the network is
# back (the outbox job), and a second time with the first map style blocked too.
# Each of these tests on the debug APK fails when StrictMode caught our code reading disk on the
# main thread or leaking a resource (scripts/ci/strict_mode.py); network on the main thread crashes
# the app.
# When the updater or the release changed (and on every push to main), update-apks builds two signed
# release APKs N and N+1 with a throwaway key and checks that the .aab has no updater, and
# update-probe has the emulator update N to N+1 from inside the app and refuse tampered ones
# (scripts/ci/update-probe.py).
# Every push to a branch of this repository runs it once (the result shows on its pull request);
# pull requests from forks run it through the pull_request event.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  # Downloads time out and retry instead of failing the build on one slow response.
  GRADLE_OPTS: >-
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=2000
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java 21: Gradle runs on it and Robolectric needs it for Android 15 and later.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: ./.github/actions/rust-android
        with:
          cache-key: android-app
      # Only this job saves the Gradle cache; the release builds read it. A key is saved once, by the
      # first job to finish, and this job resolves more (ktlint, lint, test libraries) than they do.
      # Robolectric downloads its Android jars into ~/.m2 at test time. Both otherwise come from
      # Maven Central on every run, which answers GitHub's runners with 429
      # (scripts/ci/cache-keys-check.py). The Robolectric key hashes its version and the Android
      # version the tests run (robolectric.properties), the two things that pick the jar. It has no
      # restore key: one would carry every older jar into each new key, so the cache would only
      # grow; a new key fetches the one jar the tests use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-android-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-android-build-
            gradle-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'androidApp/src/test/resources/robolectric.properties') }}
      # The committed gradle-wrapper.jar must be an official Gradle release before anything runs it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Gradle wrapper
        run: |
          for i in 1 2 3; do
            ./gradlew --version && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
      - name: release and CI tools
        run: |
          python3 -I scripts/release/version-check.py
          python3 -I scripts/release/edge-commit-check.py
          python3 -I scripts/release/publish-check.py
          python3 -I scripts/release/update-feed-check.py
          python3 -I scripts/ci/cache-keys-check.py
      - name: check, screenshots, debug APK
        run: ./gradlew --continue check verifyRoborazziDirectDebug assembleDirectDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pubky-maps-debug-apk
          path: androidApp/build/outputs/apk/direct/debug/androidApp-direct-debug.apk
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  emulator-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 35
      TARGET: google_apis
      PROFILE: pixel_6
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pubky-maps-debug-apk
          path: apk
      - name: enable KVM, zbar for reading the QR code
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q zbar-tools
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The AVD and its boot snapshot, made once and reused by later runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          # The month in the key renews the snapshot as the runner's emulator and image move on.
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.PROFILE }}-x86_64-${{ steps.month.outputs.month }}
      - name: create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: smoke test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: |
            bash scripts/ci/emulator-smoke.sh apk/androidApp-direct-debug.apk /tmp/smoke/smoke
            python3 -I scripts/ci/sign-in-probe.py apk/androidApp-direct-debug.apk /tmp/smoke/sign-in
            bash scripts/ci/emulator-links.sh /tmp/smoke/links
            bash scripts/ci/emulator-search.sh apk/androidApp-direct-debug.apk /tmp/smoke/search
            bash scripts/ci/emulator-place.sh apk/androidApp-direct-debug.apk /tmp/smoke/place
            bash scripts/ci/emulator-offline.sh apk/androidApp-direct-debug.apk /tmp/smoke/offline
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-smoke-api${{ env.API_LEVEL }}
          path: /tmp/smoke/
          if-no-files-found: ignore
          retention-days: 14

  # Every Synonym-run host unreachable for the phone: a DNS server on the runner (dnsmasq) answers
  # NXDOMAIN for them and the emulator uses it. Two boots: Synonym blocked, then also the first map
  # style (tiles.openfreemap.org), so the style fallback runs on a real device image.
  synonym-blocked:
    needs: [build, changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 35
      TARGET: google_apis
      PROFILE: pixel_6
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
      SYNONYM_DOMAINS: pubky.app pubky.org synonym.to coder.riginode.xyz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pubky-maps-debug-apk
          path: apk
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-app
          save-if: false
      # A stored session for a made-up user on a made-up homeserver (core/examples), made here and
      # never uploaded.
      - name: session fixture
        run: cargo run --locked -q -p pubky-maps-core --example offline_session_fixture -- "$RUNNER_TEMP/session.json"
      - name: enable KVM, dnsmasq
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q && sudo apt-get install -y -q dnsmasq-base
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The same AVD and boot snapshot as the smoke test.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.PROFILE }}-x86_64-${{ steps.month.outputs.month }}
      - name: create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: block Synonym hosts
        run: bash scripts/ci/block-hosts.sh start "$RUNNER_TEMP/dns" $SYNONYM_DOMAINS
      - name: Synonym blocked
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-snapshot-save -dns-server 127.0.0.2 ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: python3 -I scripts/ci/synonym-blocked.py apk/androidApp-direct-debug.apk "$RUNNER_TEMP/session.json" synonym /tmp/blocked/synonym
      - name: block Synonym hosts and the first map style
        if: always()
        run: |
          bash scripts/ci/block-hosts.sh stop "$RUNNER_TEMP/dns"
          bash scripts/ci/block-hosts.sh start "$RUNNER_TEMP/dns" $SYNONYM_DOMAINS tiles.openfreemap.org
      - name: Synonym and OpenFreeMap blocked
        if: always()
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-snapshot-save -dns-server 127.0.0.2 ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: python3 -I scripts/ci/synonym-blocked.py apk/androidApp-direct-debug.apk "$RUNNER_TEMP/session.json" openfreemap /tmp/blocked/openfreemap
      - if: always()
        run: |
          bash scripts/ci/block-hosts.sh stop "$RUNNER_TEMP/dns"
          cp "$RUNNER_TEMP"/dns/*.log /tmp/blocked/ 2> /dev/null || true
          rm -f "$RUNNER_TEMP/session.json"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synonym-blocked-api${{ env.API_LEVEL }}
          path: /tmp/blocked/
          if-no-files-found: ignore
          retention-days: 14

  # Whether the updater or the release changed against main (a pull request: against its base), so
  # the probe also runs on later pushes of a branch whose earlier pushes changed the updater.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      update: ${{ steps.pick.outputs.update }}
      app: ${{ steps.pick.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          paths='^(androidApp/(build\.gradle\.kts|proguard-rules\.pro)$|androidApp/src/(direct|store|updateProbe|main)/'
          paths+='|shared/build\.gradle\.kts$|shared/src/commonMain/kotlin/to/pubky/maps/(update/|config/|settings/SettingsScreen\.kt$|App\.kt$)'
          paths+='|scripts/release/|scripts/ci/update-probe\.py$|release/|gradle/|gradle\.properties$|\.github/workflows/(android|release)\.yml$)'
          base=$PR_BASE
          if [ -z "$base" ] && [ "$REF" != refs/heads/main ]; then
            base=$(git merge-base origin/main "$GITHUB_SHA" 2> /dev/null || true)
          fi
          # The app, the core or CI: what the Synonym-blocked test covers.
          app_paths='^(androidApp/|shared/|core/|Cargo\.(toml|lock)$|scripts/(ci/|build-android\.sh$|gen-kotlin-bindings\.sh$)'
          app_paths+='|gradle/|gradle\.properties$|[^/]*\.gradle\.kts$|\.github/(workflows/android\.yml$|actions/))'
          if [ "$EVENT" = workflow_dispatch ] || [ "$REF" = refs/heads/main ] || [ -z "$base" ]; then
            update=true
            app=true
          else
            files=$(git diff --name-only "$base" "$GITHUB_SHA")
            if grep -Eq "$paths" <<< "$files"; then update=true; else update=false; fi
            if grep -Eq "$app_paths" <<< "$files"; then app=true; else app=false; fi
          fi
          echo "update=$update" | tee -a "$GITHUB_OUTPUT"
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  update-apks:
    needs: changes
    if: needs.changes.outputs.update == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # The build job's cargo and Gradle caches, read only: that job resolves and builds what this one
      # needs and more, and only one job saves each cache.
      - uses: ./.github/actions/rust-android
        with:
          cache-key: android-app
          save: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-android-build-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-android-build-
            gradle-
      # N and N+1, each signed with a release key made for this run only; the feed key is throwaway
      # too. Gradle never sees either key.
      - name: N and N+1 (release, R8, signed with a throwaway key)
        shell: bash
        run: |
          d="$RUNNER_TEMP/keys"; mkdir -p "$d" out
          pass=$(openssl rand -hex 16)
          echo "::add-mask::$pass"
          ANDROID_KEYSTORE_PASSWORD=$pass keytool -genkeypair -keystore "$d/probe.p12" -storetype PKCS12 \
            -alias probe -keyalg RSA -keysize 2048 -validity 2 -dname CN=update-probe \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD
          openssl genpkey -algorithm ed25519 -out out/feed.pem
          openssl pkey -in out/feed.pem -pubout -outform DER | tail -c 32 | base64 -w0 > out/feed.pub
          for build in "1000 0.0.1-probe.1 old" "1001 0.0.1-probe.2 new"; do
            read -r code name file <<< "$build"
            ./gradlew :androidApp:assembleDirectRelease -Ppubkymaps.versionCode="$code" \
              -Ppubkymaps.versionName="$name" -Ppubkymaps.updateChannel=edge \
              -Ppubkymaps.updateFeedUrl=http://127.0.0.1:18480/update-edge.json \
              -Ppubkymaps.updatePublicKey="$(cat out/feed.pub)" -Ppubkymaps.updateProbe=true
            ANDROID_KEYSTORE_B64=$(base64 -w0 "$d/probe.p12") ANDROID_KEYSTORE_PASSWORD=$pass ANDROID_KEY_ALIAS=probe \
              bash scripts/release/sign.sh androidApp/build/outputs/apk/direct/release/androidApp-direct-release-unsigned.apk \
              "out/$file.apk"
            bash scripts/release/apk-facts.sh "out/$file.apk"
          done
      # As release.yml builds it: the bundle for app stores has no updater.
      - name: the .aab has no updater
        run: |
          ./gradlew :androidApp:bundleStoreRelease
          python3 -I scripts/release/aab-check.py androidApp/build/outputs/bundle/storeRelease/androidApp-store-release.aab out/old.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-apks
          path: out/
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-apks-reports
          path: |
            androidApp/build/outputs/mapping/
            androidApp/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  update-probe:
    needs: update-apks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_LEVEL: 35
      TARGET: google_apis
      PROFILE: pixel_6
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-audio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-apks
          path: update
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The same AVD and boot snapshot as the smoke test.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.PROFILE }}-x86_64-${{ steps.month.outputs.month }}
      - name: create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "AVD snapshot created"
      - name: the app updates itself
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: x86_64
          profile: ${{ env.PROFILE }}
          force-avd-creation: false
          ram-size: 4096M
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: python3 -I scripts/ci/update-probe.py update/old.apk update/new.apk update/feed.pem update/feed.pub /tmp/update-probe
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-probe-api${{ env.API_LEVEL }}
          path: /tmp/update-probe/
          if-no-files-found: ignore
          retention-days: 14
