org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# iOS targets are declared in :shared but can only be built on macOS.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The app version. Release builds set the versionCode, the versionName and the update channel
# (scripts/release/version.sh); a local build is versionCode 1 without updates.
pubkymaps.version=0.1.0
